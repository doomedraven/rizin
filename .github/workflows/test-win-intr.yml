name: Fork Windows Interrupt Signal Test

on:
  push:
    branches:
      - test/win-interrupt-signal

jobs:
  test-interrupt-signal-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msvc-static
            cc: ""
            meson_opts: "--default-library=static -Db_vscrt=static_from_buildtype"
          - name: clang-cl-dyn
            cc: "clang-cl"
            meson_opts: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install meson and ninja
        shell: cmd
        run: python -m pip install meson ninja PyYAML tomli
      - name: Configure and build test_interrupt_signal
        shell: cmd
        env:
          CC: ${{ matrix.cc }}
        run: |
          meson setup --buildtype=release -Denable_tests=true -Denable_rz_test=false -Dsubprojects_check=false ${{ matrix.meson_opts }} build
          ninja -C build test/integration/test_interrupt_signal.exe
      - name: Stress test interrupt_signal (50x)
        shell: cmd
        run: meson test -C build --repeat=50 --print-errorlogs interrupt_signal
